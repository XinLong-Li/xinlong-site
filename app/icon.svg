<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    |𝑥| —— 绝对值 / 范数记号，同时编码姓名首字母（李新龙 → LXL，
    小写 lxl 在无衬线体里即呈现为 |x|）。

    这一版对应导航里的笔刷 mark：黑底 + 白色笔画。favicon 只有 16–48px，
    笔刷纹理在那个尺寸只会变成噪点，所以这里用矢量把轮廓简化——两根微弯的
    竖线和中间一个手写感的 x。导航里的大 mark 仍用带纹理的位图蒙版。

    全部由路径构造，不使用文字元素：文字依赖系统字体，不同平台结果不一致。
    白色 #fff 与深底 #0f1216 的对比度约 18:1；16px 时笔画约 1.4px。
  -->
  <rect width="32" height="32" rx="7" fill="#0f1216"/>
  <path
    d="M6.4 6.5C5.9 12.5 5.9 19.5 6.4 25.5"
    stroke="#fff" stroke-width="2.8" stroke-linecap="round" fill="none"
  />
  <path
    d="M25.6 6.5C26.1 12.5 26.1 19.5 25.6 25.5"
    stroke="#fff" stroke-width="2.8" stroke-linecap="round" fill="none"
  />
  <path
    d="M11 10.5C14.5 14 17.5 17.5 21 21.5"
    stroke="#fff" stroke-width="2.8" stroke-linecap="round" fill="none"
  />
  <path
    d="M21 10.5C17.5 14 14.5 17.5 11 21.5"
    stroke="#fff" stroke-width="2.8" stroke-linecap="round" fill="none"
  />
</svg>
