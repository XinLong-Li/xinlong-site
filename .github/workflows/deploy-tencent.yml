name: Deploy to Tencent Cloud

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Preflight - check required secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          APP_DIR: ${{ secrets.APP_DIR }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          set -e
          for var in SSH_HOST SSH_USER SSH_PRIVATE_KEY APP_DIR; do
            if [ -z "${!var}" ]; then
              echo "❌ Missing required secret: $var" >&2
              exit 1
            fi
          done
          echo "✅ Deploy secrets present"

          # 这两个是**可选**的：都配了才会在服务器上生成 .env。
          have_hash=$([ -n "$ADMIN_PASSWORD_HASH" ] && echo yes || echo no)
          have_secret=$([ -n "$SESSION_SECRET" ] && echo yes || echo no)
          if [ "$have_hash" = yes ] && [ "$have_secret" = yes ]; then
            echo "✅ ADMIN_PASSWORD_HASH / SESSION_SECRET 已配置 —— 部署时会写入 .env"
          elif [ "$have_hash" = no ] && [ "$have_secret" = no ]; then
            echo "· ADMIN_PASSWORD_HASH / SESSION_SECRET 未配置 —— 部署会跳过 .env（后台登录不可用）"
          else
            echo "❌ 这两个必须同时配置或同时不配置（当前 hash=$have_hash secret=$have_secret）" >&2
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.0
        # ⚠️ 这个 env: 块不能删。
        #
        # `with.envs` 只声明「要转发哪些变量名」，**值必须由步骤的 env: 提供**。
        # 少了它，这两个变量在 action 容器里根本不存在，envs 会转发空值 ——
        # 即使 Secrets 配好了，服务器上也拿到不到任何东西。
        # （最初就是漏了这块，导致脚本在 git reset 之后静默退出。）
        env:
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          # 用变量而非字面值，脚本正文里没有可泄露的内容。
          # GitHub 也会把日志里的这些值自动打码成 ***。
          envs: ADMIN_PASSWORD_HASH,SESSION_SECRET
          script: |
            set -e
            echo "[1/8] cd to app dir"
            cd ${{ secrets.APP_DIR }}

            # Ensure repo exists; clone if missing
            if [ ! -d .git ]; then
              git clone https://github.com/${{ github.repository }} .
            fi

            echo "[2/8] git fetch"
            git fetch --all

            echo "[3/8] git reset"
            git reset --hard origin/main

            echo "[4/8] mkdir logs"
            mkdir -p logs

            # ---------------------------------------------------------------
            # 由 GitHub Secrets 声明式地生成 .env
            #
            # 只有两个 Secret 都配了才写；否则完全不动（保持这个功能可选）。
            #
            # .env 被 .gitignore 覆盖，所以上面的 `git reset --hard` 不会碰它。
            #
            # 注意：这个文件由本工作流独家拥有。手工往 .env 里加别的变量，
            # 下次部署会被这行覆盖 —— 要加就加在这里。
            # ---------------------------------------------------------------
            echo "[5/8] write .env (hash_set=$([ -n "${ADMIN_PASSWORD_HASH:-}" ] && echo yes || echo no) secret_set=$([ -n "${SESSION_SECRET:-}" ] && echo yes || echo no))"

            if [ -n "${ADMIN_PASSWORD_HASH:-}" ] && [ -n "${SESSION_SECRET:-}" ]; then
              # 用子 shell 限定 umask，避免影响后续命令；
              # 这样文件创建时权限就是 600，不存在"先建后改"的窗口期。
              ( umask 077; printf '%s\n%s\n' \
                  "ADMIN_PASSWORD_HASH=\"$ADMIN_PASSWORD_HASH\"" \
                  "SESSION_SECRET=\"$SESSION_SECRET\"" > .env )
              chmod 600 .env

              # 写完自校验：确认两个键都在，否则立刻失败而不是留个坏的 .env
              for k in ADMIN_PASSWORD_HASH SESSION_SECRET; do
                grep -q "^$k=" .env || { echo "ERROR: .env 缺少 $k" >&2; exit 1; }
              done
              echo "OK: .env written ($(wc -c < .env | tr -d ' ') bytes)"
            else
              echo "SKIP: ADMIN_PASSWORD_HASH / SESSION_SECRET 未配置，不动 .env"
            fi

            echo "[6/8] npm ci"
            npm ci

            echo "[7/8] npm run build"
            npm run build

            echo "[8/8] pm2 restart"
            if ! command -v pm2 >/dev/null 2>&1; then
              npm i -g pm2
            fi
            pm2 startOrRestart ecosystem.config.js --env production
            pm2 save

            echo "DONE"

      - name: Notify
        run: echo "Deployment triggered to Tencent Cloud"