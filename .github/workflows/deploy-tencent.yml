name: Deploy to Tencent Cloud

# 部署模型：**在 runner 上构建，把产物推给服务器。**
#
# 为什么改掉原来那套「SSH 上去 git fetch + npm ci + npm run build」：
# 那条链路要服务器主动访问 github.com，而这条跨境链路会被 TLS 间歇重置
# （GnuTLS recv error -110 / HTTP2 framing error / 连接超时），失败率不低，
# 且和代码完全无关。现在服务器只被动接收一个 tar 包，不再访问外网。
#
# 这一步从"锦上添花"变成"必须做"，是因为内容统一走 git 之后，**每保存一篇
# 文章都会触发一次部署** —— 部署不稳定等于发文不稳定。
#
# 链路上不再有 appleboy/ssh-action，因此也就没有了它的 `envs:` / `env:` 陷阱
# （那个陷阱的表现是变量静默为空）。改用原生 ssh + stdin：
#   - 产物：tar 流直接喂给远端 `cat >`，没有中间文件
#   - 部署脚本：从 runner 的 checkout 直接喂给远端 bash 的 stdin，
#     所以它不存在于服务器上，是版本化的，而且能在本地跑真实目录验证
on:
  push:
    branches: [ main ]

# 同一时刻只允许一个部署在跑。两个部署并发会在服务器上互相踩：两边都会
# rm -rf .next / node_modules 再 mv 新的进去，交错执行会留下一个混合状态，
# 而且两边都会重启 PM2。cancel-in-progress 保持 false —— 部署跑到一半被
# 掐掉正是最糟的情况，让它跑完，新的排队等。
concurrency:
  group: deploy-tencent
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # BUILD_STANDALONE=1 才会产出 output: 'standalone' 的那份自包含应用。
      # 本地不加这个变量，是为了让 `npm start` 不被打出 "does not work with
      # output: standalone" 的警告、也不多产出一份 .next/standalone。
      - name: Build (standalone)
        run: npm run build:standalone

      - name: Package release artifact
        run: bash scripts/package-release.sh

      - name: Preflight - check required secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          APP_DIR: ${{ secrets.APP_DIR }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GITHUB_SYNC_TOKEN: ${{ secrets.GITHUB_SYNC_TOKEN }}
        run: |
          set -e
          for var in SSH_HOST SSH_USER SSH_PRIVATE_KEY APP_DIR; do
            if [ -z "${!var}" ]; then
              echo "❌ 缺少必需的 Secret: $var" >&2
              exit 1
            fi
          done
          echo "✅ 部署相关的 Secret 齐全"

          # 这两个必须同时配或同时不配：都配了才会在服务器上重写 .env。
          have_hash=$([ -n "$ADMIN_PASSWORD_HASH" ] && echo yes || echo no)
          have_secret=$([ -n "$SESSION_SECRET" ] && echo yes || echo no)
          if [ "$have_hash" = yes ] && [ "$have_secret" = yes ]; then
            echo "✅ ADMIN_PASSWORD_HASH / SESSION_SECRET 已配置 —— 部署时会重写服务器 .env"
          elif [ "$have_hash" = no ] && [ "$have_secret" = no ]; then
            echo "· ADMIN_PASSWORD_HASH / SESSION_SECRET 未配置 —— 服务器 .env 保持原样"
          else
            echo "❌ 这两个必须同时配置或同时不配置（当前 hash=${have_hash} secret=${have_secret}）" >&2
            exit 1
          fi

          if [ -n "$GITHUB_SYNC_TOKEN" ]; then
            echo "✅ GITHUB_SYNC_TOKEN 已配置 —— 后台可以在云端写文章"
          else
            echo "· GITHUB_SYNC_TOKEN 未配置 —— 后台只能看，不能保存"
          fi

          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            echo "✅ SSH_KNOWN_HOSTS 已配置 —— SSH 会严格校验服务器主机密钥"
          else
            echo "· SSH_KNOWN_HOSTS 未配置 —— 首次连接自动信任服务器主机密钥（可用 ssh-keyscan 取，见 README）"
          fi

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          PORT="${SSH_PORT:-22}"
          case "$PORT" in ''|*[!0-9]*) PORT=22 ;; esac

          # 配了 SSH_KNOWN_HOSTS 就钉死主机密钥；没配则首次连接自动信任。
          # 钉死更强：runner 是一次性的，accept-new 实际上等于每次都"首次"。
          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            HOST_KEY_CHECKING=yes
          else
            HOST_KEY_CHECKING=accept-new
          fi

          # 写进 ssh_config 而不是每次敲一长串 -o：公钥、端口、超时集中一处，
          # 上传和部署两步都复用同一个 Host 别名。
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName $SSH_HOST
            User $SSH_USER
            Port $PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking $HOST_KEY_CHECKING
            ConnectTimeout 30
            ServerAliveInterval 15
            ServerAliveCountMax 8
            TCPKeepAlive yes
          EOF
          chmod 600 ~/.ssh/config

          # 变量一律用 ${} 包起来：紧跟其后的中文标点会被 bash 当成变量名的一部分，
          # set -u 下直接报 unbound variable 并终止这一步。
          echo "✅ SSH 已配置：${SSH_USER}@${SSH_HOST}:${PORT}（主机密钥校验=${HOST_KEY_CHECKING}）"

      - name: Upload artifacts
        env:
          APP_DIR: ${{ secrets.APP_DIR }}
        run: |
          set -euo pipefail

          upload() {   # $1 = 本地文件, $2 = 远端文件名
            echo "  上传 $1（$(du -h "$1" | cut -f1 | tr -d ' ')）"
            # 直接流过去，不在服务器上留中间文件、也不重复写盘。
            # pipefail 保证 ssh 侧失败（比如磁盘满）不会被 cat 的成功掩盖 ——
            # 这正是 bash 默认行为下最容易漏掉的一类失败。
            cat "$1" | ssh deploy-target "cat > '$APP_DIR/$2'"
          }

          # 依赖层 15MB 而应用层只有 1MB 出头。实测 GitHub runner → 腾讯云的上传
          # 只有约 19 KB/s（17MB 传了 15 分 22 秒），所以必须避免重复传依赖层：
          # 发一篇文章只该付应用层的代价。
          DEPS_HASH="$(cat release-deps.hash)"
          REMOTE_HASH="$(ssh deploy-target "cat '$APP_DIR/.deps-hash' 2>/dev/null || echo none")"

          if [ "$DEPS_HASH" = "$REMOTE_HASH" ]; then
            echo "✅ 依赖未变（${DEPS_HASH}），跳过依赖层上传"
          else
            echo "依赖有变化：服务器上是 ${REMOTE_HASH}，本次是 ${DEPS_HASH}"
            upload release-deps.tar.gz release-deps.tar.gz
          fi

          upload release-app.tar.gz release-app.tar.gz
          echo "✅ 上传完成"

      - name: Deploy on server
        env:
          APP_DIR: ${{ secrets.APP_DIR }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GITHUB_SYNC_TOKEN: ${{ secrets.GITHUB_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          # 把凭据和依赖指纹以 shell 赋值的形式拼在脚本前面，一起走 stdin。
          # 走 stdin 而不是命令行参数，是为了不在服务器的 `ps` 里留下它们。
          # %q 负责转义 —— token 里出现引号、空格、$ 都不会破。
          # 凭据为空时写成 ''，远端脚本据此走 SKIP 分支、保持服务器 .env 不动。
          {
            printf 'ADMIN_PASSWORD_HASH=%q\n' "${ADMIN_PASSWORD_HASH:-}"
            printf 'SESSION_SECRET=%q\n' "${SESSION_SECRET:-}"
            printf 'GITHUB_SYNC_TOKEN=%q\n' "${GITHUB_SYNC_TOKEN:-}"
            printf 'DEPS_HASH=%q\n' "$(cat release-deps.hash)"
            cat scripts/deploy-release.sh
          } | ssh deploy-target "bash -s -- '$APP_DIR'"

      - name: Notify
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ 已部署到腾讯云"
          else
            echo "❌ 部署失败。服务器大概率仍在跑旧版本 —— 解压与校验都发生在替换之前。"
          fi
