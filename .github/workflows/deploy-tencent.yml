name: Deploy to Tencent Cloud

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Preflight - check required secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          APP_DIR: ${{ secrets.APP_DIR }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GITHUB_SYNC_TOKEN: ${{ secrets.GITHUB_SYNC_TOKEN }}
        run: |
          set -e
          for var in SSH_HOST SSH_USER SSH_PRIVATE_KEY APP_DIR; do
            if [ -z "${!var}" ]; then
              echo "❌ Missing required secret: $var" >&2
              exit 1
            fi
          done
          echo "✅ Deploy secrets present"

          # 这两个是**可选**的：都配了才会在服务器上生成 .env。
          have_hash=$([ -n "$ADMIN_PASSWORD_HASH" ] && echo yes || echo no)
          have_secret=$([ -n "$SESSION_SECRET" ] && echo yes || echo no)
          if [ "$have_hash" = yes ] && [ "$have_secret" = yes ]; then
            echo "✅ ADMIN_PASSWORD_HASH / SESSION_SECRET 已配置 —— 部署时会写入 .env"
          elif [ "$have_hash" = no ] && [ "$have_secret" = no ]; then
            echo "· ADMIN_PASSWORD_HASH / SESSION_SECRET 未配置 —— 部署会跳过 .env（后台登录不可用）"
          else
            echo "❌ 这两个必须同时配置或同时不配置（当前 hash=$have_hash secret=$have_secret）" >&2
            exit 1
          fi

          # GITHUB_SYNC_TOKEN 完全独立：没有它站点照常跑，只是后台的云端
          # 保存功能不可用（会提示"未配置 token"）。
          if [ -n "$GITHUB_SYNC_TOKEN" ]; then
            echo "✅ GITHUB_SYNC_TOKEN 已配置 —— 后台可以在云端写文章"
          else
            echo "· GITHUB_SYNC_TOKEN 未配置 —— 后台只能看，不能保存"
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.0
        # ⚠️ 这个 env: 块不能删。
        #
        # `with.envs` 只声明「要转发哪些变量名」，**值必须由步骤的 env: 提供**。
        # 少了它，这两个变量在 action 容器里根本不存在，envs 会转发空值 ——
        # 即使 Secrets 配好了，服务器上也拿到不到任何东西。
        # （最初就是漏了这块，导致脚本在 git reset 之后静默退出。）
        env:
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GITHUB_SYNC_TOKEN: ${{ secrets.GITHUB_SYNC_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          # 用变量而非字面值，脚本正文里没有可泄露的内容。
          # GitHub 也会把日志里的这些值自动打码成 ***。
          envs: ADMIN_PASSWORD_HASH,SESSION_SECRET,GITHUB_SYNC_TOKEN
          script: |
            set -e
            echo "[1/9] cd to app dir"
            cd ${{ secrets.APP_DIR }}

            # Ensure repo exists; clone if missing
            if [ ! -d .git ]; then
              git clone https://github.com/${{ github.repository }} .
            fi

            echo "[2/9] git fetch"
            git fetch --all

            echo "[3/9] git reset"
            git reset --hard origin/main

            echo "[4/9] mkdir logs"
            mkdir -p logs

            # ---------------------------------------------------------------
            # 清理已经归档进仓库的遗留草稿
            #
            # content/runtime/ 是旧的"运行时发布"机制留下的目录，现在内容
            # 一律走 git，那套写入已经拆了。服务器上还有当初从后台发的几篇，
            # 它们不在仓库里。
            #
            # 用户在新编辑器里编辑这些草稿时，会把它提交进仓库 —— 从那一刻
            # 起磁盘上同一篇就有两份。读取时"git 优先"，所以内容是对的，但
            # runtime 那份会变成隐患：**如果哪天从 git 删掉这篇，runtime 副本
            # 会让它复活**。
            #
            # 所以每次部署后，把 slug 已经存在于 git 的 runtime 副本删掉。
            # 放在构建之后执行，这样万一这次部署失败，副本还在，站点不丢内容。
            # ---------------------------------------------------------------
            echo "[5/9] prune archived drafts"
            pruned=0
            for kind in posts moments; do
              for f in content/runtime/$kind/*/*.md; do
                [ -f "$f" ] || continue
                # content/runtime/posts/zh/x.md -> content/posts/zh/x.md
                rel=${f#content/runtime/}
                if [ -f "content/$rel" ]; then
                  rm -f "$f"
                  pruned=$((pruned + 1))
                fi
              done
            done
            if [ "$pruned" -gt 0 ]; then
              echo "  已清理 $pruned 篇已归档的草稿"
            else
              echo "  没有需要清理的草稿"
            fi

            # ---------------------------------------------------------------
            # 由 GitHub Secrets 声明式地生成 .env
            #
            # 只有两个 Secret 都配了才写；否则完全不动（保持这个功能可选）。
            #
            # .env 被 .gitignore 覆盖，所以上面的 `git reset --hard` 不会碰它。
            #
            # 注意：这个文件由本工作流独家拥有。手工往 .env 里加别的变量，
            # 下次部署会被这行覆盖 —— 要加就加在这里。
            # ---------------------------------------------------------------
            echo "[6/9] write .env (hash=$([ -n "${ADMIN_PASSWORD_HASH:-}" ] && echo yes || echo no) session=$([ -n "${SESSION_SECRET:-}" ] && echo yes || echo no) token=$([ -n "${GITHUB_SYNC_TOKEN:-}" ] && echo yes || echo no))"

            if [ -n "${ADMIN_PASSWORD_HASH:-}" ] && [ -n "${SESSION_SECRET:-}" ]; then
              # 用子 shell 限定 umask，避免影响后续命令；
              # 这样文件创建时权限就是 600，不存在"先建后改"的窗口期。
              #
              # GITHUB_SYNC_TOKEN 是**可选**的：没有它站点照常跑，只是后台的
              # 云端保存功能不可用。所以它单独判断，不参与上面的必需性检查。
              ( umask 077; {
                  printf '%s\n%s\n' \
                    "ADMIN_PASSWORD_HASH=\"$ADMIN_PASSWORD_HASH\"" \
                    "SESSION_SECRET=\"$SESSION_SECRET\""
                  if [ -n "${GITHUB_SYNC_TOKEN:-}" ]; then
                    printf '%s\n' "GITHUB_SYNC_TOKEN=\"$GITHUB_SYNC_TOKEN\""
                  fi
                } > .env )
              chmod 600 .env

              # 写完自校验：必需的键必须在，否则立刻失败而不是留个坏的 .env
              for k in ADMIN_PASSWORD_HASH SESSION_SECRET; do
                grep -q "^$k=" .env || { echo "ERROR: .env 缺少 $k" >&2; exit 1; }
              done

              if [ -n "${GITHUB_SYNC_TOKEN:-}" ]; then
                echo "OK: .env written ($(wc -c < .env | tr -d ' ') bytes, 含 GITHUB_SYNC_TOKEN)"
              else
                echo "OK: .env written ($(wc -c < .env | tr -d ' ') bytes) —— 未配 GITHUB_SYNC_TOKEN，云端保存功能不可用"
              fi
            else
              echo "SKIP: ADMIN_PASSWORD_HASH / SESSION_SECRET 未配置，不动 .env"
            fi

            echo "[7/9] npm ci"
            npm ci

            echo "[8/9] npm run build"
            npm run build

            echo "[9/9] pm2 restart"
            if ! command -v pm2 >/dev/null 2>&1; then
              npm i -g pm2
            fi
            pm2 startOrRestart ecosystem.config.js --env production
            pm2 save

            echo "DONE"

      - name: Notify
        run: echo "Deployment triggered to Tencent Cloud"