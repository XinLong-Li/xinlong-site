name: Deploy to Tencent Cloud

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Preflight - check required secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          APP_DIR: ${{ secrets.APP_DIR }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GITHUB_SYNC_TOKEN: ${{ secrets.GITHUB_SYNC_TOKEN }}
        run: |
          set -e
          for var in SSH_HOST SSH_USER SSH_PRIVATE_KEY APP_DIR; do
            if [ -z "${!var}" ]; then
              echo "❌ Missing required secret: $var" >&2
              exit 1
            fi
          done
          echo "✅ Deploy secrets present"

          # 这两个是**可选**的：都配了才会在服务器上生成 .env。
          have_hash=$([ -n "$ADMIN_PASSWORD_HASH" ] && echo yes || echo no)
          have_secret=$([ -n "$SESSION_SECRET" ] && echo yes || echo no)
          if [ "$have_hash" = yes ] && [ "$have_secret" = yes ]; then
            echo "✅ ADMIN_PASSWORD_HASH / SESSION_SECRET 已配置 —— 部署时会写入 .env"
          elif [ "$have_hash" = no ] && [ "$have_secret" = no ]; then
            echo "· ADMIN_PASSWORD_HASH / SESSION_SECRET 未配置 —— 部署会跳过 .env（后台登录不可用）"
          else
            echo "❌ 这两个必须同时配置或同时不配置（当前 hash=$have_hash secret=$have_secret）" >&2
            exit 1
          fi

          # GITHUB_SYNC_TOKEN 完全独立：没有它站点照常跑，只是后台的云端
          # 保存功能不可用（会提示"未配置 token"）。
          if [ -n "$GITHUB_SYNC_TOKEN" ]; then
            echo "✅ GITHUB_SYNC_TOKEN 已配置 —— 后台可以在云端写文章"
          else
            echo "· GITHUB_SYNC_TOKEN 未配置 —— 后台只能看，不能保存"
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.0
        # ⚠️ 这个 env: 块不能删。
        #
        # `with.envs` 只声明「要转发哪些变量名」，**值必须由步骤的 env: 提供**。
        # 少了它，这两个变量在 action 容器里根本不存在，envs 会转发空值 ——
        # 即使 Secrets 配好了，服务器上也拿到不到任何东西。
        # （最初就是漏了这块，导致脚本在 git reset 之后静默退出。）
        env:
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GITHUB_SYNC_TOKEN: ${{ secrets.GITHUB_SYNC_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          # 用变量而非字面值，脚本正文里没有可泄露的内容。
          # GitHub 也会把日志里的这些值自动打码成 ***。
          envs: ADMIN_PASSWORD_HASH,SESSION_SECRET,GITHUB_SYNC_TOKEN
          script: |
            set -e
            echo "[1/9] cd to app dir"
            cd ${{ secrets.APP_DIR }}

            # Ensure repo exists; clone if missing
            if [ ! -d .git ]; then
              git clone https://github.com/${{ github.repository }} .
            fi

            echo "[2/9] git fetch"
            git fetch --all

            echo "[3/9] git reset"
            git reset --hard origin/main

            echo "[4/9] mkdir logs"
            mkdir -p logs

            # --- Prune runtime drafts that have since been archived into git ---
            # content/runtime/ is the leftover from the old "publish at runtime"
            # mechanism, which is gone: content now goes through git. Editing one
            # of those drafts commits it to the repo, after which two copies
            # exist on disk. Reads prefer git so the content stays correct, but
            # the runtime copy is a hazard -- deleting the post from git would
            # resurrect it. So drop the copies whose slug now exists in git.
            # NOTE: use `find`, not a shell glob. An unmatched glob aborts
            # some shells outright (zsh: "no matches found"; bash with
            # failglob) and content/runtime/ may well be absent -- it is
            # empty on a fresh server. `find` returns success either way.
            echo "[5/9] prune archived drafts"
            if [ -d content/runtime ]; then
              find content/runtime -type f -name "*.md" | while read -r f; do
                rel=${f#content/runtime/}
                if [ -f "content/$rel" ]; then
                  rm -f "$f"
                  echo "  pruned: $rel"
                fi
              done
            fi
            echo "  prune step done"

            # --- Generate .env declaratively from GitHub Secrets ---
            # Written only when both required secrets are present; otherwise the
            # file is left untouched so the feature stays optional. .env is
            # gitignored, so the `git reset --hard` above ignores it.
            # This workflow owns the file: anything added by hand is overwritten
            # on the next deploy.
            echo "[6/9] write .env (hash=$([ -n "${ADMIN_PASSWORD_HASH:-}" ] && echo yes || echo no) session=$([ -n "${SESSION_SECRET:-}" ] && echo yes || echo no) token=$([ -n "${GITHUB_SYNC_TOKEN:-}" ] && echo yes || echo no))"

            if [ -n "${ADMIN_PASSWORD_HASH:-}" ] && [ -n "${SESSION_SECRET:-}" ]; then
              echo "  [6a] both required secrets present"
              # Subshell umask so the file is created 0600 directly, with no
              # window where it is world-readable.
              #
              # GITHUB_SYNC_TOKEN is optional: without it the site runs fine and
              # only the admin's cloud-save feature is unavailable, so it is
              # checked separately rather than being required here.
              ( umask 077; {
                  printf '%s\n%s\n' \
                    "ADMIN_PASSWORD_HASH=\"$ADMIN_PASSWORD_HASH\"" \
                    "SESSION_SECRET=\"$SESSION_SECRET\""
                  if [ -n "${GITHUB_SYNC_TOKEN:-}" ]; then
                    printf '%s\n' "GITHUB_SYNC_TOKEN=\"$GITHUB_SYNC_TOKEN\""
                  fi
                } > .env )
              echo "  [6b] .env written"
              chmod 600 .env
              echo "  [6c] chmod 600 ok"

              # Self-check: required keys must be present, else fail now rather
              # than leave a broken .env behind.
              for k in ADMIN_PASSWORD_HASH SESSION_SECRET; do
                grep -q "^$k=" .env || { echo "ERROR: .env is missing $k" >&2; exit 1; }
              done
              echo "  [6d] both keys present"

              if [ -n "${GITHUB_SYNC_TOKEN:-}" ]; then
                echo "OK: .env written ($(wc -c < .env | tr -d ' ') bytes, incl. GITHUB_SYNC_TOKEN)"
              else
                echo "OK: .env written ($(wc -c < .env | tr -d ' ') bytes) -- no GITHUB_SYNC_TOKEN, cloud save disabled"
              fi
            else
              echo "SKIP: ADMIN_PASSWORD_HASH / SESSION_SECRET not set, leaving .env alone"
            fi

            echo "[7/9] npm ci"
            npm ci

            echo "[8/9] npm run build"
            npm run build

            echo "[9/9] pm2 restart"
            if ! command -v pm2 >/dev/null 2>&1; then
              npm i -g pm2
            fi
            pm2 startOrRestart ecosystem.config.js --env production
            pm2 save

            echo "DONE"

      - name: Notify
        run: echo "Deployment triggered to Tencent Cloud"