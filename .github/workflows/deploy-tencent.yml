name: Deploy to Tencent Cloud

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.APP_DIR }}
            # Ensure repo exists; clone if missing
            if [ ! -d .git ]; then
              git clone https://github.com/${{ github.repository }} .
            fi
            git fetch --all
            git reset --hard origin/main
            # Install Node (optional if already installed)
            if ! command -v node >/dev/null 2>&1; then
              echo "Node not found; please install Node 20 manually or via nvm"
            fi
            # Install deps & build
            npm ci
            npm run build
            # Ensure PM2 is available
            if ! command -v pm2 >/dev/null 2>&1; then
              npm i -g pm2
            fi
            # Start or restart with PM2 using ecosystem config
            pm2 startOrRestart ecosystem.config.js --env production
            pm2 save

      - name: Notify
        run: echo "Deployment triggered to Tencent Cloud"