name: Uptime Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check public site
        run: |
          set -e
          curl -fsSL --max-time 15 https://xinlong-li.site/api/health >/dev/null || curl -fsSL --max-time 15 https://xinlong-li.site/ >/dev/null

      - name: Create incident on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Uptime incident: site unreachable`;
            const body = `Automated monitor failed to reach the site at ${new Date().toISOString()}.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['incident']
            });
