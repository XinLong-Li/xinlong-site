name: Uptime Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check public site
        run: |
          # Check if site returns 200 OK (homepage auto-redirects to /zh)
          curl -fsSL --max-time 15 -w "%{http_code}" https://xinlong-li.site/ | grep -q "200\|301\|302"

      - name: Create incident on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Uptime incident: site unreachable`;
            const body = `Automated monitor failed to reach the site at ${new Date().toISOString()}.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['incident']
            });
